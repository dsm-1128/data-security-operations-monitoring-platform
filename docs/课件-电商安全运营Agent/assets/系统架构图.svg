<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 850" role="img" aria-labelledby="title desc"><title id="title">企业生产参考架构</title><desc id="desc">应用服务与 Worker 可独立部署；这是课件设计，不代表当前原型已完成生产迁移。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#8b9bb5"/></marker></defs><rect width="960" height="850" rx="18" fill="#fff"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="36" y="43" fill="#1b2b47" font-size="24" font-weight="700">企业生产参考架构</text><text x="36" y="71" fill="#718097" font-size="14">应用服务与 Worker 可独立部署；这是课件设计，不代表当前原型已完成生产迁移。</text><rect x="36" y="105" width="888" height="92" rx="12" fill="#eef3ff" stroke="#cad6f6"/><text x="480" y="135" text-anchor="middle" font-size="18" font-weight="700" fill="#304aa5">用户入口</text><text x="480" y="162" text-anchor="middle" font-size="14" fill="#46546b">安全分析员 / 审批人</text><text x="480" y="186" text-anchor="middle" font-size="14" fill="#46546b">企业 SSO / 事件工作台</text><path d="M 480 197 L 480 224" fill="none" stroke="#8b9bb5" stroke-width="2" marker-end="url(#a)"/><rect x="36" y="225" width="888" height="92" rx="12" fill="#eef3ff" stroke="#cad6f6"/><text x="480" y="255" text-anchor="middle" font-size="18" font-weight="700" fill="#304aa5">API 与业务控制</text><text x="480" y="282" text-anchor="middle" font-size="14" fill="#46546b">FastAPI / RBAC / 版本校验</text><text x="480" y="306" text-anchor="middle" font-size="14" fill="#46546b">事件状态机 / 审批绑定 / 审计</text><path d="M 480 317 L 480 344" fill="none" stroke="#8b9bb5" stroke-width="2" marker-end="url(#a)"/><rect x="36" y="345" width="888" height="92" rx="12" fill="#eaf7f4" stroke="#b4dfd4"/><text x="480" y="375" text-anchor="middle" font-size="18" font-weight="700" fill="#146b59">Agent 编排</text><text x="480" y="402" text-anchor="middle" font-size="14" fill="#46546b">LangGraph：初筛 → 调查 → 响应</text><text x="480" y="426" text-anchor="middle" font-size="14" fill="#46546b">Flash：提取与初筛；Plus：综合研判</text><path d="M 480 437 L 480 464" fill="none" stroke="#8b9bb5" stroke-width="2" marker-end="url(#a)"/><rect x="36" y="465" width="888" height="92" rx="12" fill="#eaf7f4" stroke="#b4dfd4"/><text x="480" y="495" text-anchor="middle" font-size="18" font-weight="700" fill="#146b59">工具与执行边界</text><text x="480" y="522" text-anchor="middle" font-size="14" fill="#46546b">六类只读查询工具 / 证据标准化</text><text x="480" y="546" text-anchor="middle" font-size="14" fill="#46546b">独立受控执行适配器 / 人工审批</text><path d="M 480 557 L 480 584" fill="none" stroke="#8b9bb5" stroke-width="2" marker-end="url(#a)"/><rect x="36" y="585" width="888" height="92" rx="12" fill="#f3f5f8" stroke="#d8dfe8"/><text x="480" y="615" text-anchor="middle" font-size="18" font-weight="700" fill="#4a596f">任务与持久化</text><text x="480" y="642" text-anchor="middle" font-size="14" fill="#46546b">MySQL：事件、任务、审批、outbox</text><text x="480" y="666" text-anchor="middle" font-size="14" fill="#46546b">Redis + Celery：投递与消费；证据对象存储</text><path d="M 480 677 L 480 704" fill="none" stroke="#8b9bb5" stroke-width="2" marker-end="url(#a)"/><rect x="36" y="705" width="888" height="92" rx="12" fill="#f3f5f8" stroke="#d8dfe8"/><text x="480" y="735" text-anchor="middle" font-size="18" font-weight="700" fill="#4a596f">企业系统与运行保障</text><text x="480" y="762" text-anchor="middle" font-size="14" fill="#46546b">日志 / 资产 / 授权 / 身份 / 业务审计 API</text><text x="480" y="786" text-anchor="middle" font-size="14" fill="#46546b">指标、追踪、告警、备份恢复与密钥管理</text></g></svg>