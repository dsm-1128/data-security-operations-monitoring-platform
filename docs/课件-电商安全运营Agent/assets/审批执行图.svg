<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 695" role="img" aria-labelledby="title desc"><title id="title">把审批授权绑定到一次明确的操作</title><desc id="desc">调查版本变化、参数变化或审批过期，必须重新确认授权。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#8b9bb5"/></marker></defs><rect width="960" height="695" rx="18" fill="#fff"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="36" y="43" fill="#1b2b47" font-size="24" font-weight="700">把审批授权绑定到一次明确的操作</text><text x="36" y="71" fill="#718097" font-size="14">调查版本变化、参数变化或审批过期，必须重新确认授权。</text><rect x="36" y="105" width="420" height="108" rx="12" fill="#eef3ff" stroke="#cad6f6"/><text x="246" y="135" text-anchor="middle" font-size="18" font-weight="700" fill="#304aa5">候选动作</text><text x="246" y="162" text-anchor="middle" font-size="14" fill="#46546b">目标 + 范围 + 时长 + 调查版本</text><text x="246" y="186" text-anchor="middle" font-size="14" fill="#46546b">生成规范化动作摘要 / hash</text><rect x="504" y="105" width="420" height="108" rx="12" fill="#fff6e6" stroke="#f1d49b"/><text x="714" y="135" text-anchor="middle" font-size="18" font-weight="700" fill="#93601a">人工审批</text><text x="714" y="162" text-anchor="middle" font-size="14" fill="#46546b">审批角色 + 有效期 + 动作摘要</text><text x="714" y="186" text-anchor="middle" font-size="14" fill="#46546b">禁止自扩权限或沿用旧版本审批</text><path d="M 456 159 L 504 159" fill="none" stroke="#8b9bb5" stroke-width="2" marker-end="url(#a)"/><path d="M 714 213 L 714 261" fill="none" stroke="#8b9bb5" stroke-width="2" marker-end="url(#a)"/><rect x="504" y="261" width="420" height="108" rx="12" fill="#eef3ff" stroke="#cad6f6"/><text x="714" y="291" text-anchor="middle" font-size="18" font-weight="700" fill="#304aa5">执行前再次校验</text><text x="714" y="318" text-anchor="middle" font-size="14" fill="#46546b">权限 / 当前版本 / hash / 过期时间</text><text x="714" y="342" text-anchor="middle" font-size="14" fill="#46546b">登记执行意图与幂等键</text><rect x="36" y="261" width="420" height="108" rx="12" fill="#eaf7f4" stroke="#b4dfd4"/><text x="246" y="291" text-anchor="middle" font-size="18" font-weight="700" fill="#146b59">调用外部受控接口</text><text x="246" y="318" text-anchor="middle" font-size="14" fill="#46546b">最小权限凭证 / 外部请求 ID</text><text x="246" y="342" text-anchor="middle" font-size="14" fill="#46546b">外部调用不放入长数据库事务</text><path d="M 504 315 L 456 315" fill="none" stroke="#8b9bb5" stroke-width="2" marker-end="url(#a)"/><path d="M 246 369 L 246 417" fill="none" stroke="#8b9bb5" stroke-width="2" marker-end="url(#a)"/><rect x="36" y="417" width="420" height="108" rx="12" fill="#eaf7f4" stroke="#b4dfd4"/><text x="246" y="447" text-anchor="middle" font-size="18" font-weight="700" fill="#146b59">目标系统回查</text><text x="246" y="474" text-anchor="middle" font-size="14" fill="#46546b">确认实际生效与影响范围</text><text x="246" y="498" text-anchor="middle" font-size="14" fill="#46546b">成功、失败和未知分别记录</text><rect x="504" y="417" width="420" height="108" rx="12" fill="#fff6e6" stroke="#f1d49b"/><text x="714" y="447" text-anchor="middle" font-size="18" font-weight="700" fill="#93601a">结果未知时</text><text x="714" y="474" text-anchor="middle" font-size="14" fill="#46546b">优先查询外部状态 / 人工核验</text><text x="714" y="498" text-anchor="middle" font-size="14" fill="#46546b">没有可靠幂等保证时禁止盲目重试</text><path d="M 456 471 L 504 471" fill="none" stroke="#8b9bb5" stroke-width="2" marker-end="url(#a)"/><rect x="36" y="571" width="888" height="83" rx="12" fill="#f3f5f8" stroke="#d8dfe8"/><text x="480" y="601" text-anchor="middle" font-size="18" font-weight="700" fill="#4a596f">全链路审计</text><text x="480" y="628" text-anchor="middle" font-size="14" fill="#46546b">事件 → 调查版本 → 审批 → 执行 → 回查；每一步均可关联和追溯。</text></g></svg>