<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 510" role="img" aria-labelledby="title desc"><title id="title">从可演示流程到可运维交付</title><desc id="desc">阶段安排为建议方案；成果验收需要真实统计台账和业务确认。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#8b9bb5"/></marker></defs><rect width="960" height="510" rx="18" fill="#fff"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="36" y="43" fill="#1b2b47" font-size="24" font-weight="700">从可演示流程到可运维交付</text><text x="36" y="71" fill="#718097" font-size="14">阶段安排为建议方案；成果验收需要真实统计台账和业务确认。</text><rect x="36" y="105" width="260" height="110" rx="12" fill="#eef3ff" stroke="#cad6f6"/><text x="166" y="135" text-anchor="middle" font-size="18" font-weight="700" fill="#304aa5">01 · 契约与基线</text><text x="166" y="162" text-anchor="middle" font-size="14" fill="#46546b">场景 / 接口 / 权限</text><text x="166" y="186" text-anchor="middle" font-size="14" fill="#46546b">样本 / 指标定义 / 数据范围</text><rect x="350" y="105" width="260" height="110" rx="12" fill="#eef3ff" stroke="#cad6f6"/><text x="480" y="135" text-anchor="middle" font-size="18" font-weight="700" fill="#304aa5">02 · 只读调查闭环</text><text x="480" y="162" text-anchor="middle" font-size="14" fill="#46546b">工具与证据模型</text><text x="480" y="186" text-anchor="middle" font-size="14" fill="#46546b">三 Agent / 报告 / 人工复核</text><rect x="664" y="105" width="260" height="110" rx="12" fill="#eaf7f4" stroke="#b4dfd4"/><text x="794" y="135" text-anchor="middle" font-size="18" font-weight="700" fill="#146b59">03 · 受控响应加固</text><text x="794" y="162" text-anchor="middle" font-size="14" fill="#46546b">审批 / 幂等 / 回查</text><text x="794" y="186" text-anchor="middle" font-size="14" fill="#46546b">持久化 / 恢复 / 审计</text><path d="M 296 160 L 350 160" fill="none" stroke="#8b9bb5" stroke-width="2" marker-end="url(#a)"/><path d="M 610 160 L 664 160" fill="none" stroke="#8b9bb5" stroke-width="2" marker-end="url(#a)"/><path d="M 794 215 L 794 275" fill="none" stroke="#8b9bb5" stroke-width="2" marker-end="url(#a)"/><rect x="664" y="275" width="260" height="110" rx="12" fill="#eaf7f4" stroke="#b4dfd4"/><text x="794" y="305" text-anchor="middle" font-size="18" font-weight="700" fill="#146b59">04 · 回放与故障验证</text><text x="794" y="332" text-anchor="middle" font-size="14" fill="#46546b">质量抽检 / 容量验证</text><text x="794" y="356" text-anchor="middle" font-size="14" fill="#46546b">权限、超时与中断恢复</text><rect x="350" y="275" width="260" height="110" rx="12" fill="#fff6e6" stroke="#f1d49b"/><text x="480" y="305" text-anchor="middle" font-size="18" font-weight="700" fill="#93601a">05 · 灰度与验收</text><text x="480" y="332" text-anchor="middle" font-size="14" fill="#46546b">按场景逐步开放</text><text x="480" y="356" text-anchor="middle" font-size="14" fill="#46546b">核对成果分子、分母和范围</text><rect x="36" y="275" width="260" height="110" rx="12" fill="#f3f5f8" stroke="#d8dfe8"/><text x="166" y="305" text-anchor="middle" font-size="18" font-weight="700" fill="#4a596f">06 · 运维与复盘</text><text x="166" y="332" text-anchor="middle" font-size="14" fill="#46546b">监控 / 手册 / 培训</text><text x="166" y="356" text-anchor="middle" font-size="14" fill="#46546b">恢复演练 / 规则与模型评估</text><path d="M 664 330 L 610 330" fill="none" stroke="#8b9bb5" stroke-width="2" marker-end="url(#a)"/><path d="M 350 330 L 296 330" fill="none" stroke="#8b9bb5" stroke-width="2" marker-end="url(#a)"/><text x="480" y="449" text-anchor="middle" font-size="16" fill="#62718b">应用回滚与业务动作回退分别设计；发现风险时可先关闭动作执行入口。</text></g></svg>