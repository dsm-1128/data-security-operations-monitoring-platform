<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 650" role="img" aria-labelledby="title desc"><title id="title">从告警到可核验的处置结果</title><desc id="desc">三 Agent 组织调查；业务服务控制复核、审批、执行与归档。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#8b9bb5"/></marker></defs><rect width="960" height="650" rx="18" fill="#fff"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="36" y="43" fill="#1b2b47" font-size="24" font-weight="700">从告警到可核验的处置结果</text><text x="36" y="71" fill="#718097" font-size="14">三 Agent 组织调查；业务服务控制复核、审批、执行与归档。</text><rect x="36" y="105" width="260" height="92" rx="12" fill="#eef3ff" stroke="#cad6f6"/><text x="166" y="135" text-anchor="middle" font-size="18" font-weight="700" fill="#304aa5">01 · 告警接入</text><text x="166" y="162" text-anchor="middle" font-size="14" fill="#46546b">原始记录留存 / 去重与事件关联</text><rect x="350" y="105" width="260" height="92" rx="12" fill="#eef3ff" stroke="#cad6f6"/><text x="480" y="135" text-anchor="middle" font-size="18" font-weight="700" fill="#304aa5">02 · 初筛 Agent</text><text x="480" y="162" text-anchor="middle" font-size="14" fill="#46546b">资产上下文 / 优先级 / 授权线索</text><rect x="664" y="105" width="260" height="92" rx="12" fill="#eef3ff" stroke="#cad6f6"/><text x="794" y="135" text-anchor="middle" font-size="18" font-weight="700" fill="#304aa5">03 · 调查 Agent</text><text x="794" y="162" text-anchor="middle" font-size="14" fill="#46546b">六类工具 / 证据链 / 缺口识别</text><path d="M 296 151 L 350 151" fill="none" stroke="#8b9bb5" stroke-width="2" marker-end="url(#a)"/><path d="M 610 151 L 664 151" fill="none" stroke="#8b9bb5" stroke-width="2" marker-end="url(#a)"/><path d="M 794 197 L 794 247" fill="none" stroke="#8b9bb5" stroke-width="2" marker-end="url(#a)"/><rect x="664" y="247" width="260" height="92" rx="12" fill="#eaf7f4" stroke="#b4dfd4"/><text x="794" y="277" text-anchor="middle" font-size="18" font-weight="700" fill="#146b59">04 · 响应 Agent</text><text x="794" y="304" text-anchor="middle" font-size="14" fill="#46546b">结构化报告 / 候选动作</text><rect x="350" y="247" width="260" height="92" rx="12" fill="#fff6e6" stroke="#f1d49b"/><text x="480" y="277" text-anchor="middle" font-size="18" font-weight="700" fill="#93601a">05 · 人工复核与审批</text><text x="480" y="304" text-anchor="middle" font-size="14" fill="#46546b">角色权限 / 当前版本 / 动作绑定</text><rect x="36" y="247" width="260" height="92" rx="12" fill="#eaf7f4" stroke="#b4dfd4"/><text x="166" y="277" text-anchor="middle" font-size="18" font-weight="700" fill="#146b59">06 · 受控执行</text><text x="166" y="304" text-anchor="middle" font-size="14" fill="#46546b">幂等记录 / 最小权限 / 外部请求</text><path d="M 664 293 L 610 293" fill="none" stroke="#8b9bb5" stroke-width="2" marker-end="url(#a)"/><path d="M 350 293 L 296 293" fill="none" stroke="#8b9bb5" stroke-width="2" marker-end="url(#a)"/><path d="M 166 339 L 166 389" fill="none" stroke="#8b9bb5" stroke-width="2" marker-end="url(#a)"/><rect x="36" y="389" width="260" height="92" rx="12" fill="#eaf7f4" stroke="#b4dfd4"/><text x="166" y="419" text-anchor="middle" font-size="18" font-weight="700" fill="#146b59">07 · 结果回查</text><text x="166" y="446" text-anchor="middle" font-size="14" fill="#46546b">实际生效 / 业务影响 / 失败处理</text><rect x="350" y="389" width="574" height="92" rx="12" fill="#f3f5f8" stroke="#d8dfe8"/><text x="637" y="419" text-anchor="middle" font-size="18" font-weight="700" fill="#4a596f">08 · 事件归档或重新调查</text><text x="637" y="446" text-anchor="middle" font-size="14" fill="#46546b">关联工单、证据、报告、审批与操作审计；旧版本保留</text><path d="M 296 435 L 350 435" fill="none" stroke="#8b9bb5" stroke-width="2" marker-end="url(#a)"/><rect x="36" y="527" width="888" height="83" rx="12" fill="#fff6e6" stroke="#f1d49b"/><text x="480" y="557" text-anchor="middle" font-size="18" font-weight="700" fill="#93601a">证据不足或执行结果未知 → 人工接管</text><text x="480" y="584" text-anchor="middle" font-size="14" fill="#46546b">不能把工具超时当作没有异常，也不能把已受理当作处置成功。</text></g></svg>