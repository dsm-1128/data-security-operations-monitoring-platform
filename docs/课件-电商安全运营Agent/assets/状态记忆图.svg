<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 575" role="img" aria-labelledby="title desc"><title id="title">运行上下文、业务事实与知识分开管理</title><desc id="desc">“记住对话”不能替代业务持久化；恢复执行必须核对外部副作用。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#8b9bb5"/></marker></defs><rect width="960" height="575" rx="18" fill="#fff"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="36" y="43" fill="#1b2b47" font-size="24" font-weight="700">运行上下文、业务事实与知识分开管理</text><text x="36" y="71" fill="#718097" font-size="14">“记住对话”不能替代业务持久化；恢复执行必须核对外部副作用。</text><rect x="36" y="105" width="420" height="140" rx="12" fill="#eef3ff" stroke="#cad6f6"/><text x="246" y="135" text-anchor="middle" font-size="18" font-weight="700" fill="#304aa5">运行上下文</text><text x="246" y="162" text-anchor="middle" font-size="14" fill="#46546b">LangGraph state / 当前节点 / 临时摘要</text><text x="246" y="186" text-anchor="middle" font-size="14" fill="#46546b">只引用必要证据，控制上下文体积</text><text x="246" y="210" text-anchor="middle" font-size="14" fill="#46546b">必要时使用已验证的持久化 checkpointer</text><rect x="504" y="105" width="420" height="140" rx="12" fill="#eaf7f4" stroke="#b4dfd4"/><text x="714" y="135" text-anchor="middle" font-size="18" font-weight="700" fill="#146b59">业务事实 · MySQL</text><text x="714" y="162" text-anchor="middle" font-size="14" fill="#46546b">事件 / 调查 / 任务 / 版本 / 权限</text><text x="714" y="186" text-anchor="middle" font-size="14" fill="#46546b">审批 / 执行 / outbox / 审计</text><text x="714" y="210" text-anchor="middle" font-size="14" fill="#46546b">数据库事实是恢复与一致性判断依据</text><rect x="36" y="293" width="420" height="140" rx="12" fill="#f3f5f8" stroke="#d8dfe8"/><text x="246" y="323" text-anchor="middle" font-size="18" font-weight="700" fill="#4a596f">知识与配置</text><text x="246" y="350" text-anchor="middle" font-size="14" fill="#46546b">手册 / 关联规则 / 提示词 / Schema</text><text x="246" y="374" text-anchor="middle" font-size="14" fill="#46546b">保留版本，支持回放与变更追溯</text><text x="246" y="398" text-anchor="middle" font-size="14" fill="#46546b">未验证需要前，不强制引入向量库</text><rect x="504" y="293" width="420" height="140" rx="12" fill="#f3f5f8" stroke="#d8dfe8"/><text x="714" y="323" text-anchor="middle" font-size="18" font-weight="700" fill="#4a596f">证据与归档</text><text x="714" y="350" text-anchor="middle" font-size="14" fill="#46546b">原始日志引用 / 查询范围 / 时间戳</text><text x="714" y="374" text-anchor="middle" font-size="14" fill="#46546b">脱敏快照 / 报告 / 历史调查版本</text><text x="714" y="398" text-anchor="middle" font-size="14" fill="#46546b">访问控制与保留周期按制度配置</text><path d="M 456 175 L 504 175" fill="none" stroke="#8b9bb5" stroke-width="2" marker-end="url(#a)"/><path d="M 246 245 L 246 293" fill="none" stroke="#8b9bb5" stroke-width="2" marker-end="url(#a)"/><path d="M 714 245 L 714 293" fill="none" stroke="#8b9bb5" stroke-width="2" marker-end="url(#a)"/><text x="480" y="495" text-anchor="middle" font-size="16" fill="#304aa5">服务端范围隔离 → 证据最小化 → 版本可追溯 → 按政策保留</text><text x="480" y="532" text-anchor="middle" font-size="14" fill="#62718b">MySQL 业务持久化不等于 LangGraph 自动续跑，也不提供外部动作的 exactly-once。</text></g></svg>