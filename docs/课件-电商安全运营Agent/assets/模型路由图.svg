<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 695" role="img" aria-labelledby="title desc"><title id="title">双模型路由与人工复核</title><desc id="desc">模型输出是辅助判断，权限与业务副作用始终由服务端控制。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#8b9bb5"/></marker></defs><rect width="960" height="695" rx="18" fill="#fff"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="36" y="43" fill="#1b2b47" font-size="24" font-weight="700">双模型路由与人工复核</text><text x="36" y="71" fill="#718097" font-size="14">模型输出是辅助判断，权限与业务副作用始终由服务端控制。</text><rect x="260" y="105" width="440" height="92" rx="12" fill="#f3f5f8" stroke="#d8dfe8"/><text x="480" y="135" text-anchor="middle" font-size="18" font-weight="700" fill="#4a596f">输入预处理与确定性规则</text><text x="480" y="162" text-anchor="middle" font-size="14" fill="#46546b">字段校验 / 脱敏 / 工具白名单 / 预算</text><path d="M 480 197 L 480 235" fill="none" stroke="#8b9bb5" stroke-width="2" marker-end="url(#a)"/><rect x="260" y="235" width="440" height="92" rx="12" fill="#eef3ff" stroke="#cad6f6"/><text x="480" y="265" text-anchor="middle" font-size="18" font-weight="700" fill="#304aa5">qwen3.5-flash</text><text x="480" y="292" text-anchor="middle" font-size="14" fill="#46546b">字段提取、分类辅助、轻量摘要</text><path d="M 480 327 L 480 365" fill="none" stroke="#8b9bb5" stroke-width="2" marker-end="url(#a)"/><rect x="260" y="365" width="440" height="92" rx="12" fill="#eaf7f4" stroke="#b4dfd4"/><text x="480" y="395" text-anchor="middle" font-size="18" font-weight="700" fill="#146b59">qwen3.5-plus</text><text x="480" y="422" text-anchor="middle" font-size="14" fill="#46546b">复杂证据综合、冲突解释、报告与建议</text><path d="M 480 457 L 480 495" fill="none" stroke="#8b9bb5" stroke-width="2" marker-end="url(#a)"/><rect x="260" y="495" width="440" height="92" rx="12" fill="#fff6e6" stroke="#f1d49b"/><text x="480" y="525" text-anchor="middle" font-size="18" font-weight="700" fill="#93601a">Schema 校验 + 规则核验 + 人工复核</text><text x="480" y="552" text-anchor="middle" font-size="14" fill="#46546b">结论引用证据；高风险动作进入审批</text><path d="M700 281 H850 V541 H706" fill="none" stroke="#8b9bb5" stroke-width="2" marker-end="url(#a)"/><text x="770" y="385" text-anchor="middle" font-size="14" fill="#62718b">简单任务</text><text x="770" y="410" text-anchor="middle" font-size="14" fill="#62718b">可跳过 Plus</text><text x="480" y="640" text-anchor="middle" font-size="15" fill="#62718b">超时、无效结构或关键证据缺失 → 有界重试 / 证据清单 / 人工接管</text></g></svg>